name: Deploy

# Ships master to Cloud Run once CI has passed on it (docs/serving.md): the
# image is built here, pushed to Artifact Registry and deployed, then every
# page of the live service is asked for (deploy/smoke.sh).
#
# The service itself is Terraform's (infra/): its CPU, memory, scaling and
# account are set there, and this workflow changes one thing, the image.
# Nothing runs until the GitHub variables are set (terraform output prints
# them): a fork, or the repository before its project exists, stays green.
# No key is stored anywhere: the job proves who it is to Google with its
# OpenID token (Workload Identity Federation).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVICE: cistergraphia

jobs:
  cloud-run:
    runs-on: ubuntu-latest
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - id: image
        run: echo "name=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}/web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The service must exist, as Terraform made it: a deploy that created
      # it would run as the default account, with Editor on the project
      - run: |
          gcloud run services describe "$SERVICE" --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(name)' >/dev/null \
            || { echo "::error::No service $SERVICE in ${{ vars.GCP_REGION }}: apply infra/ first (docs/serving.md)"; exit 1; }

      # Only the image: every other setting carries over from the revision
      # Terraform shaped. No labels of the action's own, which Terraform
      # would see as drift
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          skip_default_labels: true

      - run: deploy/smoke.sh "${{ steps.deploy.outputs.url }}" | tee /tmp/smoke.log && tail -1 /tmp/smoke.log >> "$GITHUB_STEP_SUMMARY"
