name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# bash with pipefail (GitHub's default shell has none): a suite that fails
# behind the `| tee` of a step summary must fail its step
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test | tee /tmp/test.log && tail -1 /tmp/test.log >> "$GITHUB_STEP_SUMMARY"
      - run: bundle exec rubocop | tee /tmp/rubocop.log && tail -1 /tmp/rubocop.log >> "$GITHUB_STEP_SUMMARY"
      - run: bundle exec rake test:sound | tee /tmp/sound.log && grep -E '^# (pass|fail)' /tmp/sound.log >> "$GITHUB_STEP_SUMMARY"
      - run: bundle exec rake test:coverage | grep -E '^Coverage'
        if: matrix.ruby == '4.0'

  # Keeps docs/security-study.md honest: the game must stay breakable, secret mode must not leak
  cryptanalysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wamerican wfrench
      - run: experiments/cryptanalysis/run.sh --check | tee /tmp/crypt.log && (grep -E 'character accuracy' /tmp/crypt.log >> "$GITHUB_STEP_SUMMARY" || true)

  # Keeps the reader's game honest: the desk, the bench and the board give the
  # message; silence by default; no axe violation; the budgets
  behaviour:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ matrix.browser }}
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 axe-core@4.10.2
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: bundle exec rake ui:play | tee /tmp/play.log && tail -1 /tmp/play.log >> "$GITHUB_STEP_SUMMARY"
        env:
          BROWSER: ${{ matrix.browser }}

  # End to end: every choice of the form makes a plate drawn whole, or a
  # refusal that says why; every plate opens on Read and deciphers back
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ matrix.browser }}
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: bundle exec rake ui:e2e | tee /tmp/e2e.log && tail -1 /tmp/e2e.log >> "$GITHUB_STEP_SUMMARY"
        env:
          BROWSER: ${{ matrix.browser }}
      - if: failure()
        run: grep -A4 '^FAIL' /tmp/e2e.log >> "$GITHUB_STEP_SUMMARY" || true

  # Keeps docs/design.md honest: nothing on a page moves under the reader
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: bundle exec rake ui:stability | tee /tmp/stability.log && tail -1 /tmp/stability.log >> "$GITHUB_STEP_SUMMARY"

  # The container the site is served from (Dockerfile): built, run, and every
  # page asked for (deploy/smoke.sh), so a change cannot break the image
  # before the deploy workflow ships it
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: cistergraphia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --detach --name web --publish 8080:8080 cistergraphia:ci
      - run: deploy/smoke.sh http://127.0.0.1:8080 | tee /tmp/smoke.log && tail -1 /tmp/smoke.log >> "$GITHUB_STEP_SUMMARY"
      - run: docker logs web
        if: always()
      # What the image carries (the base image's packages, the gems): no known
      # vulnerability of high or critical severity that has a fix
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln cistergraphia:ci

  # The infrastructure as code (infra/): formatted, and valid against the
  # providers' schemas. No credentials: nothing is planned or applied here
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform -chdir=infra fmt -check -diff
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      # The Terraform read as a security reviewer would (.trivyignore names
      # what is meant, and why)
      - run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          config --exit-code 1 --severity HIGH,CRITICAL infra
