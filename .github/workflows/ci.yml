name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# bash with pipefail (GitHub's default shell has none): a suite that fails
# behind the `| tee` of a step summary must fail its step
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test | tee /tmp/test.log && tail -1 /tmp/test.log >> "$GITHUB_STEP_SUMMARY"
      - run: bundle exec rubocop | tee /tmp/rubocop.log && tail -1 /tmp/rubocop.log >> "$GITHUB_STEP_SUMMARY"
      - run: bundle exec rake test:sound | tee /tmp/sound.log && grep -E '^# (pass|fail)' /tmp/sound.log >> "$GITHUB_STEP_SUMMARY"
      - run: bundle exec rake test:coverage | grep -E '^Coverage'
        if: matrix.ruby == '4.0'

  # Keeps docs/security-study.md honest: the game must stay breakable, secret mode must not leak
  cryptanalysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wamerican wfrench
      - run: experiments/cryptanalysis/run.sh --check | tee /tmp/crypt.log && (grep -E 'character accuracy' /tmp/crypt.log >> "$GITHUB_STEP_SUMMARY" || true)

  # Keeps the reader's game honest: the desk, the bench and the board give the
  # message; silence by default; no axe violation; the budgets
  behaviour:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ matrix.browser }}
      - run: npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.2
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: bundle exec rake ui:play | tee /tmp/play.log && tail -1 /tmp/play.log >> "$GITHUB_STEP_SUMMARY"
        env:
          BROWSER: ${{ matrix.browser }}

  # End to end: every choice of the form makes a plate drawn whole, or a
  # refusal that says why; every plate opens on Read and deciphers back
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ matrix.browser }}
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: bundle exec rake ui:e2e | tee /tmp/e2e.log && tail -1 /tmp/e2e.log >> "$GITHUB_STEP_SUMMARY"
        env:
          BROWSER: ${{ matrix.browser }}
      - if: failure()
        run: grep -A4 '^FAIL' /tmp/e2e.log >> "$GITHUB_STEP_SUMMARY" || true

  # Keeps docs/design.md honest: nothing on a page moves under the reader
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: bundle exec rake ui:stability | tee /tmp/stability.log && tail -1 /tmp/stability.log >> "$GITHUB_STEP_SUMMARY"

  # The container the site is served from (Dockerfile): built, run, and every
  # page asked for (deploy/smoke.sh), so a change cannot break the image
  # before the deploy workflow ships it
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cistergraphia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --detach --name web --publish 8080:8080 cistergraphia:ci
      - run: deploy/smoke.sh http://127.0.0.1:8080 | tee /tmp/smoke.log && tail -1 /tmp/smoke.log >> "$GITHUB_STEP_SUMMARY"
      - run: docker logs web
        if: always()
